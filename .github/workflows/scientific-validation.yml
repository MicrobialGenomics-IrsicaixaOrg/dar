name: Scientific validation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Monte Carlo profile
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
      engine:
        description: Engine to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - deseq
          - aldex
          - ancom
          - corncob
          - linda
          - maaslin
          - wilcox
          - lefse
      base_seed:
        description: Optional Monte Carlo base seed
        required: false
        type: string
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: scientific-validation-${{ inputs.profile || 'full' }}-${{ inputs.engine || 'all' }}
  cancel-in-progress: false

jobs:
  bioc-config:
    runs-on: ubuntu-latest
    outputs:
      bioc: ${{ steps.config.outputs.bioc }}
      r: ${{ steps.config.outputs.r }}
      container: ${{ steps.config.outputs.container }}
      matrix: ${{ steps.config.outputs.matrix }}
      profile: ${{ steps.config.outputs.profile }}
      base_seed: ${{ steps.config.outputs.base_seed }}
    steps:
      - id: config
        name: Resolve the active Bioconductor release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_ENGINE: ${{ inputs.engine }}
          SELECTED_PROFILE: ${{ inputs.profile }}
          SELECTED_SEED: ${{ inputs.base_seed }}
        run: |
          config=$(curl -fsSL https://bioconductor.org/config.yaml)
          value() {
            echo "$config" | awk -F': ' -v key="$1" '$1 == key { gsub(/"/, "", $2); print $2; exit }'
          }
          bioc=$(value "release_version")
          r=$(value "r_version_associated_with_release" | grep -Eo '^[0-9]+\.[0-9]+')
          major=$(echo "$bioc" | cut -d. -f1)
          minor=$(echo "$bioc" | cut -d. -f2)
          if [[ -z "$bioc" || -z "$r" ]]; then
            echo "Unable to resolve the active Bioconductor release"
            exit 1
          fi
          echo "bioc=$bioc" >> "$GITHUB_OUTPUT"
          echo "r=$r" >> "$GITHUB_OUTPUT"
          echo "container=bioconductor/bioconductor_docker:RELEASE_${major}_${minor}" >> "$GITHUB_OUTPUT"
          scenarios='["cross_sectional_null","cross_sectional_signal","sparse_zero_inflated","fixed_confounder","longitudinal_interaction","longitudinal_random_effect","missing_unbalanced"]'
          if [[ "$EVENT_NAME" == "schedule" || "$SELECTED_ENGINE" == "all" ]]; then
            matrix='[{"engine":"deseq","scenario":"all"},{"engine":"aldex","scenario":"all"},{"engine":"corncob","scenario":"all"},{"engine":"linda","scenario":"all"},{"engine":"maaslin","scenario":"all"},{"engine":"wilcox","scenario":"all"},{"engine":"lefse","scenario":"all"}]'
            for scenario in $(echo "$scenarios" | tr -d '[]"' | tr ',' ' '); do
              matrix=$(echo "$matrix" | sed "s/]$/,{\"engine\":\"ancom\",\"scenario\":\"$scenario\"}]/")
            done
          elif [[ "$SELECTED_ENGINE" == "ancom" ]]; then
            matrix='[]'
            for scenario in $(echo "$scenarios" | tr -d '[]"' | tr ',' ' '); do
              if [[ "$matrix" == "[]" ]]; then
                matrix="[{\"engine\":\"ancom\",\"scenario\":\"$scenario\"}]"
              else
                matrix=$(echo "$matrix" | sed "s/]$/,{\"engine\":\"ancom\",\"scenario\":\"$scenario\"}]/")
              fi
            done
          else
            matrix="[{\"engine\":\"$SELECTED_ENGINE\",\"scenario\":\"all\"}]"
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            profile="full"
          else
            profile="$SELECTED_PROFILE"
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          if [[ -n "$SELECTED_SEED" ]]; then
            base_seed="$SELECTED_SEED"
          else
            base_seed=$((GITHUB_RUN_ID % 2000000000))
          fi
          echo "base_seed=$base_seed" >> "$GITHUB_OUTPUT"

  validate:
    needs: bioc-config
    runs-on: ubuntu-latest
    container: ${{ needs.bioc-config.outputs.container }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.bioc-config.outputs.matrix) }}
    env:
      R_LIBS_USER: /__w/_temp/ScientificValidationLibrary
      VALIDATION_PROFILE: ${{ needs.bioc-config.outputs.profile }}
      VALIDATION_BASE_SEED: ${{ needs.bioc-config.outputs.base_seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create validation library
        shell: bash
        run: mkdir -p "$R_LIBS_USER"

      - name: Restore validation package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: scientific-validation-${{ matrix.engine }}-R${{ needs.bioc-config.outputs.r }}-Bioc${{ needs.bioc-config.outputs.bioc }}-${{ hashFiles('DESCRIPTION', 'dev/scientific-validation/profiles.csv', 'dev/scientific-validation/thresholds.csv') }}

      - name: Install validation dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "pkgload", "testthat"))
          remotes::install_cran("BiocManager")
          BiocManager::install(
            version = "${{ needs.bioc-config.outputs.bioc }}",
            ask = FALSE,
            force = TRUE
          )
          remotes::install_local(
            dependencies = c("Depends", "Imports", "LinkingTo"),
            build_vignettes = FALSE,
            upgrade = "never"
          )

      - name: Apply the temporary CVXR workaround
        if: matrix.engine == 'ancom'
        shell: Rscript {0}
        run: |
          remotes::install_version(
            "CVXR", version = "1.0.15",
            repos = "https://cran.rstudio.com/", upgrade = "never"
          )

      - name: Install engine dependencies
        shell: Rscript {0}
        run: |
          source("dev/scientific-validation/R/engines.R")
          BiocManager::install(
            validation_engine("${{ matrix.engine }}")$packages,
            ask = FALSE,
            update = FALSE
          )

      - name: Apply the temporary Rfast workaround
        if: matrix.engine == 'aldex'
        shell: Rscript {0}
        run: |
          remotes::install_cran(
            "Rfast", repos = "https://cloud.r-project.org",
            type = "source", upgrade = "never", force = TRUE
          )
          library(Rfast)

      - name: Test validation infrastructure
        shell: Rscript {0}
        run: source("dev/scientific-validation/tests/testthat.R")

      - name: Run scientific validation
        shell: bash
        run: |
          Rscript --vanilla dev/scientific-validation/run-validation.R \
            --profile="$VALIDATION_PROFILE" \
            --engine="${{ matrix.engine }}" \
            --scenario="${{ matrix.scenario }}" \
            --base_seed="$VALIDATION_BASE_SEED" \
            --output_dir="validation-results/${{ matrix.engine }}-${{ matrix.scenario }}" \
            --strict=true

      - name: Upload engine artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-validation-${{ matrix.engine }}-${{ matrix.scenario }}
          path: validation-results/${{ matrix.engine }}-${{ matrix.scenario }}
          if-no-files-found: warn
          retention-days: 90

  report:
    needs: [bioc-config, validate]
    if: always()
    runs-on: ubuntu-latest
    env:
      VALIDATION_PROFILE: ${{ needs.bioc-config.outputs.profile }}
      VALIDATION_BASE_SEED: ${{ needs.bioc-config.outputs.base_seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ needs.bioc-config.outputs.r }}

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install report dependencies
        shell: Rscript {0}
        run: install.packages(c("dplyr", "ggplot2", "jsonlite", "knitr", "rmarkdown"))

      - name: Download engine artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scientific-validation-*
          path: validation-artifacts

      - name: Aggregate and render the scientific report
        shell: bash
        env:
          VALIDATION_MATRIX: ${{ needs.bioc-config.outputs.matrix }}
        run: |
          Rscript --vanilla dev/scientific-validation/write-expected.R \
            validation-artifacts/expected.csv
          Rscript --vanilla dev/scientific-validation/aggregate-validation.R \
            validation-artifacts validation-report

      - name: Write Actions summary
        if: always()
        shell: bash
        run: Rscript --vanilla dev/scientific-validation/summarize-validation.R validation-report

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-validation-report
          path: validation-report
          if-no-files-found: error
          retention-days: 90

  archive:
    name: Archive full scientific validation
    needs: [bioc-config, report]
    if: >-
      always() && github.ref == 'refs/heads/devel' &&
      (github.event_name == 'schedule' ||
      (inputs.profile == 'full' && inputs.engine == 'all'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      VALIDATION_PROFILE: ${{ needs.bioc-config.outputs.profile }}
      VALIDATION_BASE_SEED: ${{ needs.bioc-config.outputs.base_seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scientific-validation-report
          path: report

      - name: Prepare durable history branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir archive
          git -C archive init -b validation-results
          git -C archive remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C archive ls-remote --exit-code origin refs/heads/validation-results; then
            git -C archive fetch --depth=1 origin validation-results
            git -C archive checkout -B validation-results FETCH_HEAD
          fi
          Rscript --vanilla source/dev/scientific-validation/archive-validation.R \
            report archive "$GITHUB_RUN_ID"

      - name: Commit durable report
        shell: bash
        run: |
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add runs history.csv latest.json
          git -C archive commit -m "validation: archive run $GITHUB_RUN_ID"
          git -C archive push origin HEAD:validation-results
